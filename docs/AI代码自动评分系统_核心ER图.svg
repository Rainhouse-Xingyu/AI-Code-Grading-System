  <rect x="90" y="1180" width="2200" height="100" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text class="note" x="115" y="1215">说明：</text>
  <text class="note" x="115" y="1245">1. “用户”通过角色字段区分学生、教师与管理员；教师创建作业，学生提交作业。</text>
  <text class="note" x="115" y="1270">2. 图中呈现评分闭环的核心实体；任务日志、评分模板明细、作业班级、文件管理等辅助表可在物理数据库设计中展开。</text>
