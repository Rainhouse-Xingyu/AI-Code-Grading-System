<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350">
  <style>
    .canvas { fill: #fff; }
    .title { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 35px; font-weight: 700; fill: #111; }
    .subtitle { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #555; }
    .entity { fill: #fff; stroke: #111; stroke-width: 2.5; }
    .relation { fill: #fff; stroke: #111; stroke-width: 2.2; }
    .attribute { fill: #fff; stroke: #111; stroke-width: 1.8; }
    .link { fill: none; stroke: #333; stroke-width: 1.7; }
    .entity-text { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 24px; font-weight: 700; fill: #111; text-anchor: middle; dominant-baseline: middle; }
    .relation-text { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: 700; fill: #111; text-anchor: middle; dominant-baseline: middle; }
    .attr-text { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; font-weight: 600; fill: #111; text-anchor: middle; dominant-baseline: middle; }
    .card { font-family: "Arial", "PingFang SC", sans-serif; font-size: 20px; font-weight: 700; fill: #111; text-anchor: middle; dominant-baseline: middle; }
    .note { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 16px; fill: #444; }
  </style>

  <rect class="canvas" x="0" y="0" width="2400" height="1350"/>
